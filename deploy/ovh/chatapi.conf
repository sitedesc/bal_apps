# Vhost nginx — chatapi.sitems.org. Vit dans le dépôt it-doc/sitesv2 (docker/nginx/vhosts.d/chatapi.conf).
# Recharger : cd /srv/sitesv2 && docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
server {
    listen 80;
    server_name chatapi.sitems.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name chatapi.sitems.org;
    ssl_certificate     /etc/letsencrypt/live/chatapi.sitems.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatapi.sitems.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 16m;

    # Résolution différée : une stack arrêtée n'empêche pas nginx de démarrer (convention aiacms).
    # chatapi_web = nginx de la stack (Swagger UI + routage vers l'API), alias déclaré sur edge_itdoc.
    resolver 127.0.0.11 valid=10s;
    set $chatapi http://chatapi_web:80;
    location / {
        proxy_pass $chatapi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # scénarios longs (OpenAI, Salesforce)
    }
}
