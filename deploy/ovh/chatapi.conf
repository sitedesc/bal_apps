# Vhost nginx — chatapi.sitems.org et tchatapi.org (même application).
#
# ╔══════════════════════════════════════════════════════════════════════════════════╗
# ║  ATTENTION — CE FICHIER EXISTE EN DEUX EXEMPLAIRES, DANS DEUX DÉPÔTS DIFFÉRENTS  ║
# ╚══════════════════════════════════════════════════════════════════════════════════╝
#
#   1. it-doc/sitesv2 (GitLab) : docker/nginx/vhosts.d/chatapi.conf
#        → L'EXEMPLAIRE QUI FAIT FOI. C'est le seul que le serveur lit : le répertoire
#          vhosts.d/ du clone /srv/sitesv2 est monté dans le conteneur itdoc_nginx, le
#          reverse proxy commun à toutes les applications du VPS it-doc.
#   2. bal_apps (GitHub) : deploy/ovh/chatapi.conf
#        → UNE COPIE, gardée à côté de l'application qu'elle publie. Le serveur ne la
#          lit jamais : la modifier seule ne change rien en service.
#
# Pourquoi deux : le proxy appartient à la stack sitesv2, l'application à bal_apps. Chaque
# application du VPS range son vhost près de son code et en dépose une copie chez le proxy.
# Odoo fait exactement pareil (odoo/deploy/ovh/odoo.conf), ifaia aussi (redac.conf).
#
# Pour modifier ce vhost — les trois gestes, toujours ensemble :
#   a. modifier le fichier, puis le recopier à l'identique dans l'autre dépôt ;
#   b. committer dans LES DEUX dépôts (les deux exemplaires doivent rester identiques :
#      un `diff` entre eux ne doit rien afficher) ;
#   c. sur le serveur, mettre à jour /srv/sitesv2 (git pull), puis recharger :
#        cd /srv/sitesv2 && docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
# Un nouveau nom d'hôte demande d'abord son certificat (voir deploy/ovh/RUNBOOK.md de bal_apps).
server {
    listen 80;
    server_name chatapi.sitems.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name chatapi.sitems.org;
    ssl_certificate     /etc/letsencrypt/live/chatapi.sitems.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatapi.sitems.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 16m;

    # Résolution différée : une stack arrêtée n'empêche pas nginx de démarrer (convention aiacms).
    # chatapi_web = nginx de la stack (Swagger UI + routage vers l'API), alias déclaré sur edge_itdoc.
    resolver 127.0.0.11 valid=10s;
    set $chatapi http://chatapi_web:80;
    location / {
        proxy_pass $chatapi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # scénarios longs (OpenAI, Salesforce)
    }
}

# ─── tchatapi.org — le nom historique de l'application, servi par la même stack ───
# Certificat : un seul, pour tchatapi.org et www.tchatapi.org (certbot --standalone, proxy arrêté ~20 s).
server {
    listen 80;
    server_name tchatapi.org www.tchatapi.org;
    return 301 https://$host$request_uri;
}
# Le joker DNS *.tchatapi.org pointe ici aussi : tout autre sous-domaine, hors certificat, rejoint www.
server {
    listen 80;
    server_name *.tchatapi.org;
    return 301 https://www.tchatapi.org$request_uri;
}
server {
    listen 443 ssl;
    server_name tchatapi.org www.tchatapi.org;
    ssl_certificate     /etc/letsencrypt/live/tchatapi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tchatapi.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s;
    set $chatapi http://chatapi_web:80;
    location / {
        proxy_pass $chatapi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # scénarios longs (OpenAI, Salesforce)
    }
}
