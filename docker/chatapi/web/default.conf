server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16m;

    # Endpoints de l'API Ballerina (même origine que Swagger UI)
    location ~ ^/(schemed_talks|schemed_talks_responses|openapi|openapi_dev|openapi_local|schemed_talk_examples|sales_persons)(/|$) {
        proxy_pass http://chatapi_api:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;   # un scénario (OpenAI, Salesforce…) peut durer plusieurs minutes
        proxy_send_timeout 600s;
    }

    # Swagger UI
    location / {
        try_files $uri $uri/ /index.html;
    }
}
